services:
  - type: web
    name: asts-kelas10
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ASTS_SERVER_KEY
        value: "BELAJAR ASTS KELAS 10"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: asts-data
      mountPath: /var/data
      sizeGB: 1
